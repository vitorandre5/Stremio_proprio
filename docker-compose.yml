services:
  media-library-manager:
    build: .
    networks:
      - default
      - media-library-data
    expose:
      - "8000"
    # Origem HTTP local para o Cloudflare Tunnel, sem publicar na interface externa.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/media_library.sqlite3}
      SQLITE_MIGRATION_URL: ${SQLITE_MIGRATION_URL:-sqlite:////data/media_library.sqlite3}
      REDIS_URL: ${REDIS_URL:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FROST_MANIFEST_URL: ${FROST_MANIFEST_URL:-https://froststream.cloutteam.com/manifest.json}
      BESTCINE_MANIFEST_URL: ${BESTCINE_MANIFEST_URL:-https://bestcine.dpdns.org/manifest.json}
      FENIXFLIX_MANIFEST_URL: ${FENIXFLIX_MANIFEST_URL:-https://fenixflix.fenixhub.online/qualities=4k,1080p,720p,sd%7Caudio=dublado,legendado%7Ccatalogs=populares_movie,populares_series,recentes_movie,recentes_series/manifest.json}
      BRAZUCA_TORRENTS_MANIFEST_URL: ${BRAZUCA_TORRENTS_MANIFEST_URL:-https://94c8cb9f702d-brazuca-torrents.baby-beamup.club/manifest.json}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://media.melhornegocio.shop}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
      MAX_TORRENT_BYTES: ${MAX_TORRENT_BYTES:-21474836480}
      LINK_CHECK_INTERVAL_SECONDS: ${LINK_CHECK_INTERVAL_SECONDS:-300}
      LINK_CHECK_TIMEOUT_SECONDS: ${LINK_CHECK_TIMEOUT_SECONDS:-15}
      MEDIA_ROOT: ${MEDIA_ROOT:-/media/stream media}
    volumes:
      - app_data:/data
      - /home/ubuntu/jellyfin/tvshows:/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:

networks:
  default:
  media-library-data:
    external: true
    name: media-library-data
